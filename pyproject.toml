[build-system]
requires = ["setuptools>=77", "wheel", "pybind11>=2.12,<4", "numpy>=1.23,<3"]
build-backend = "setuptools.build_meta"

[project]
name = "autooptlib"
dynamic = ["version"]
description = "Automated metaheuristic design with executable algorithm graphs"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Qi Zhao", email = "zhaoq@sustech.edu.cn" }, { name = "Swarm Intelligence Lab" }]
keywords = ["automated algorithm design", "metaheuristics", "optimization", "evolutionary computation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = ["cloudpickle>=3,<4", "numpy>=1.23,<3", "threadpoolctl>=3,<4"]

[project.scripts]
autooptlib-mcp = "autooptlib.mcp_server:main"

[project.optional-dependencies]
cpu = ["numba>=0.60,<1"]
applications = ["scipy>=1.10,<2"]
benchmarks = ["ioh>=0.3.18,<1"]
mcp = ["ioh>=0.3.18,<1", "matplotlib>=3.7,<4", "mcp>=1.30,<2", "pydantic>=2.11,<3"]
test = ["pytest>=7.4", "scipy>=1.10,<2"]
dev = ["build>=1.2", "pytest>=7.4", "scipy>=1.10,<2", "ruff>=0.9,<1"]

[project.urls]
Homepage = "https://github.com/auto4opt/AutoOptLib"
Repository = "https://github.com/auto4opt/AutoOptLib"
Issues = "https://github.com/auto4opt/AutoOptLib/issues"

[tool.setuptools]
include-package-data = false
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["autooptlib*"]
namespaces = false

[tool.setuptools.package-data]
"autooptlib.runtime._native" = ["*.cpp", "*.hpp", "NUMPY_LICENSE.txt"]

[tool.setuptools.dynamic]
version = { attr = "autooptlib._version.__version__" }

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
