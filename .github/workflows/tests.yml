name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.11"
          - os: windows-latest
            python: "3.11"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test]"
      - run: python -W error -m pytest

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test]"
      - run: >-
          python -W error -m pytest
          --cov=autooptlib
          --cov-report=term-missing
          --cov-fail-under=90

  aldes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test,aldes]"
      - run: python -W error -m pytest tests/unit/test_aldes.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip install dist/*.whl
      - name: Validate installed wheel outside the repository
        working-directory: /tmp
        run: |
          python - <<'PY'
          from types import SimpleNamespace
          from pathlib import Path
          import tempfile
          import autooptlib
          from autooptlib.problems import cec2013_f1
          from autooptlib.utils.solve import input_algorithm

          assert autooptlib.__version__ == "1.3.0"
          problems, data, _ = cec2013_f1([SimpleNamespace()], [10], "construct")
          assert problems[0].bound.shape == (2, 10)
          assert data[0].o.shape == (10,)

          problem = autooptlib.make_problem(
              lambda decision, dimension: float((decision ** 2).sum()),
              bounds=(-1.0, 1.0),
          )
          custom, custom_data, _ = problem([SimpleNamespace(N=2, Gmax=1)], [2], "construct")
          assert custom[0].evaluate(custom_data[0], [0.0, 0.0])[0] == 0.0

          algorithm, _ = input_algorithm(SimpleNamespace(AlgName="Continuous Random Search"))
          with tempfile.TemporaryDirectory() as directory:
              path = autooptlib.save_algorithm(algorithm, Path(directory) / "algorithm.json")
              assert autooptlib.load_algorithm(path).operator_pheno
          PY

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[docs]"
      - run: sphinx-build -W --keep-going -b html docs docs/_build/html

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: python -m mypy

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .

  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - run: python benchmarks/check_core_runtime.py --max-seconds 10
